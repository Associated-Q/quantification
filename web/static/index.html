function renderAIData(d, wallMs) {
  const box = $('#ai-body');
  if (!box) return;
  const desc = d.description || {}, adv = d.advice || {};
  const passages = Array.isArray(d.passages) ? d.passages : [];
  const patterns = Array.isArray(desc.patterns) ? desc.patterns : [];
  const tags = patterns.length
    ? `<div class="ai-tags">${patterns.map(p => `<span class="ai-ptag">${esc(aiPatternText(p))}</span>`).join('')}</div>`
    : '<div class="why">未识别到形态标签</div>';
  const passageHTML = passages.length ? passages.map((p, i) => {
    const n = p && p.n != null ? p.n : i + 1;
    const text = p && p.text != null ? String(p.text) : '';
    const pages = aiPassagePages(p || {});
    const more = text.length > 60 ? '<span class="ai-more" data-more="1">展开全文</span>' : '';
    return `<div class="ai-passage">
      <div class="ph"><span class="ai-ref">[${esc(n)}]</span>
        <b>《${esc((p && p.book_title) || '未知出处')}》</b>${pages ? `<span>${esc(pages)}</span>` : ''}</div>
      <div class="ptext">${esc(text || '（无原文）')}</div>${more}
    </div>`;
  }).join('') : stateHTML('未检索到书中依据');
  const risks = Array.isArray(adv.risks) ? adv.risks : (adv.risks ? [adv.risks] : []);
  const risksHTML = risks.length
    ? risks.map(r => `<div class="ai-risk">· ${esc(aiRiskText(r))}</div>`).join('')
    : '<span class="why">—</span>';
  const cached = d.cached === true ? '缓存命中' : (d.cached === false ? '本次新生成' : '');
  const elapsed = Number.isFinite(Number(d.elapsed_ms))
    ? `${Number(d.elapsed_ms)} ms` : `${wallMs} ms`;
  const genAt = d.created_at ? `生成于 ${esc(String(d.created_at).slice(11, 19))}` : '';
  const meta = `分析日期 ${esc(d.date || '—')}${cached ? ' · ' + cached : ''}`
    + `${genAt ? ' · ' + genAt : ''} · 耗时 ${esc(elapsed)}`;
  box.innerHTML = `
    <div class="ai-sec">
      <div class="ai-sec-title">描述</div>
      <div class="ai-summary">${esc(desc.summary || '—')}</div>
      ${tags}
      <div class="ai-line"><span class="k">波浪</span><span class="v">${esc(aiFieldText(desc.wave))}</span></div>
      <div class="ai-line"><span class="k">支撑状态</span><span class="v">${esc(aiFieldText(desc.support_state))}</span></div>
      <div class="ai-line"><span class="k">动能</span><span class="v">${esc(aiFieldText(desc.momentum))}</span></div>
    </div>
    <div class="ai-sec">
      <div class="ai-sec-title">依据（书中原文）</div>
      ${passageHTML}
    </div>
    <div class="ai-sec">
      <div class="ai-sec-title">结论</div>
      <div class="ai-line"><span class="k">建议</span><span class="v"><span class="badge ${badgeClass(adv.action)}">${esc(adv.action || '—')}</span></span></div>
      <div class="ai-line"><span class="k">建议仓位</span><span class="v num">${aiPosition(adv.target_position)}</span></div>
      <div class="ai-line"><span class="k">研判理由</span><span class="v">${aiReasonHTML(adv.rationale)}</span></div>
      <div class="ai-line"><span class="k">风险</span><span class="v ai-risks">${risksHTML}</span></div>
    </div>
    <div class="ai-meta">${meta}</div>`;
}

async function loadAIHistory(sym, version) {
  try {
    const d = await request('/api/ai/advice?symbol=' + encodeURIComponent(sym));
    if (version !== detailVersion) return;
    renderAIHistory(d && Array.isArray(d.items) ? d.items : [], sym);
  } catch (e) {
    if (version !== detailVersion) return;
    if (e.httpStatus !== 404) reportError('研判历史加载失败', e);
  }
}

/* 详情页切换股票时重置；只读历史缓存，不自动触发模型调用 */
async function loadAIRegion(sym, version) {
  const host = $('#d-ai');
  if (!host) return;
  aiAnalyzing = false;
  host.innerHTML = aiShellHTML();
  const body = $('#ai-body');
  if (body) body.innerHTML = stateHTML('读取已有研判…', true);

  let items = [], historyFailed = false, full = null;
  const [latestRes, histRes] = await Promise.allSettled([
    request('/api/ai/latest/' + encodeURIComponent(sym)),
    request('/api/ai/advice?symbol=' + encodeURIComponent(sym))
  ]);
  if (version !== detailVersion) return;

  if (latestRes.status === 'fulfilled' && latestRes.value) {
    full = latestRes.value;
  } else if (latestRes.status === 'rejected' && latestRes.reason?.httpStatus !== 404) {
    reportError('今日研判读取失败', latestRes.reason);
  }
  if (histRes.status === 'fulfilled') {
    items = histRes.value && Array.isArray(histRes.value.items) ? histRes.value.items : [];
  } else if (histRes.reason?.httpStatus !== 404) {
    historyFailed = true;
    reportError('研判历史加载失败', histRes.reason);
  }

  renderAIHistory(items, sym);
  const b = $('#ai-body');
  if (!b) return;
  if (full) {
    renderAIData(full, 0);
    if (full.stale) {
      const box = $('#ai-body');
      if (box) {
        const warn = document.createElement('div');
        warn.className = 'ai-note';
        warn.style.cssText = 'background:#331619;border-color:#5a2a2a;color:#ffb7b7;margin-bottom:10px';
        const sign = full.price_drift_pct > 0 ? '+' : '';
        warn.textContent = `研判基于 ${full.price_used} 元，现价 ${full.current_price} 元`
          + `（${sign}${full.price_drift_pct}%），数据已过期，正在重新分析…`;
        box.prepend(warn);
      }
      runAIAnalysis(true);
    }
  }
  else if (historyFailed) b.innerHTML = stateHTML('研判历史读取失败，可点击上方按钮生成');
  else b.innerHTML = stateHTML('尚未生成，点击上方按钮');
}

async function runAIAnalysis(force) {
  if (aiAnalyzing || !curSymbol) return;
  const sym = curSymbol, version = detailVersion;
  aiAnalyzing = true;
  const body = $('#ai-body');
  const started = Date.now();
  const btn = $('#ai-run');
  if (btn) { btn.disabled = true; btn.textContent = '分析中 0s'; }
  if (body) body.innerHTML = stateHTML('模型研判中 0 秒…', true);
  const tick = setInterval(() => {
    if (version !== detailVersion) return;
    const sec = Math.round((Date.now() - started) / 1000);
    const b = $('#ai-run');
    if (b) b.textContent = `分析中 ${sec}s`;
    const state = body && body.querySelector('.state.loading');
    if (state) state.textContent = `模型研判中 ${sec} 秒…`;
  }, 1000);
  try {
    // 模型生成可能较久，单独放宽超时；POST 不做自动重试
    const d = await request('/api/ai/analyze/' + encodeURIComponent(sym)
                             + (force ? '?force=1' : ''), {
      method: 'POST', timeout: 180000
    });
    if (version !== detailVersion) return;
    renderAIData(d, Math.round(Date.now() - started));
    loadAIHistory(sym, version);
  } catch (e) {
    if (version !== detailVersion) return;
    const b = $('#ai-body');
    if (e.httpStatus === 404) {
      if (b) b.innerHTML = stateHTML('尚未生成，点击上方按钮');
    } else {
      if (b) b.innerHTML = stateHTML('AI 研判生成失败，请稍后重试');
      reportError('AI 研判失败', e);
    }
  } finally {
    clearInterval(tick);
    if (version === detailVersion) {
      aiAnalyzing = false;
      const b = $('#ai-run');
      if (b) { b.disabled = false; b.textContent = 'AI 重新分析'; }
    }
  }
}

const GROUP_COLORS = ['#ffd166', '#4fb3a0', '#ff6b9d', '#8fa8f5', '#f2a65a',
                      '#67c8e8', '#c78bf0', '#9ed36a', '#e8836b', '#8fd6c0'];
const DEGREE_WIDTH = [1.2, 1.9, 2.8];   // 小 / 中 / 大
const DEGREE_FONT = [8, 9, 10];

const KChart = {
  cv: null, ctx: null, data: [], mas: {}, start: 0, count: 120,
  drag: null, hover: -1, W: 0, H: 420, period: 'day', wave: null,
  ai: null, baseFib: null, waveMissing: false,

  init() {
    this.cv = document.getElementById('kchart');
    this.ctx = this.cv.getContext('2d');
    this.cv.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    this.cv.addEventListener('mousedown', e => {
      if (this.data.length) this.drag = { x: e.clientX, start: this.start };
    });
    window.addEventListener('mouseup', () => { this.drag = null; });
    this.cv.addEventListener('mousemove', e => this.onMove(e));
    this.cv.addEventListener('mouseleave', () => { this.hover = -1; this.draw(); });
    window.addEventListener('resize', () => this.draw());
    this.cv.addEventListener('touchstart', e => {
      if (!this.data.length || e.touches.length !== 1) return;
      const touch = e.touches[0];
      this.drag = { x: touch.clientX, start: this.start };
      this.hover = -1;
      e.preventDefault();
    }, { passive: false });
    this.cv.addEventListener('touchmove', e => {
      if (!this.drag || e.touches.length !== 1) return;
      e.preventDefault();
      this.onMove(e.touches[0]);
    }, { passive: false });
    this.cv.addEventListener('touchend', () => { this.drag = null; });
    this.cv.addEventListener('touchcancel', () => { this.drag = null; });
  },

  reset() {
    this.data = [];
    this.mas = {};
    this.wave = null;
    this.ai = null;
    this.baseFib = null;
    this.waveMissing = false;
    this.start = 0;
    this.count = 120;
    this.drag = null;
    this.hover = -1;
    this.clearWaveAI();
    this.updateWaveLegend();
    this.draw();
  },

  clearWaveAI() {
    const el = document.getElementById('wave-ai');
    if (el) el.innerHTML = '';
  },

  async load(symbol, period) {
    const d = await request(`/api/kline/${encodeURIComponent(symbol)}?period=${period}&limit=800`);
    if (symbol !== curSymbol || period !== curPeriod || !$('#view-detail').classList.contains('on')) return;
    if (!Array.isArray(d.bars)) throw new Error('服务返回了无效数据');
    this.data = d.bars || [];
    this.mas = d.mas || {};
    this.wave = d.wave || null;
    this.waveMissing = !d.wave;
    this.ai = null;
    this.baseFib = this.wave ? this.wave.fib : null;
    this.clearWaveAI();
    this.period = period;
    this.count = Math.min(120, this.data.length);
    this.start = Math.max(0, this.data.length - this.count);
    this.hover = -1;
    this.updateLegend();
    this.updateWaveLegend();
    this.draw();
  },

  updateLegend() {
    const items = [['MA5', '#e0a13c'], ['MA20', '#d0679e'], ['MA60', '#4fb3a0']];
    if (this.period === 'day') items.push(['年线 MA250', '#6f8fd6']);
    const el = document.getElementById('klegend');
    if (el) {
      el.innerHTML = items.map(([n, c]) =>
        `<span class="lg"><i style="background:${c}"></i>${n}</span>`).join('');
    }
  },

  updateWaveLegend() {
    const el = document.getElementById('wlegend');
    if (!el) return;
    const w = this.wave;
    if (!w) {
      el.innerHTML = this.waveMissing
        ? '<span class="why" style="color:#e0a94a">后端未返回浪型数据：请重启服务加载最新代码</span>'
        : '';
      return;
    }
    let status;
    if (w.valid) {
      status = `<span class="wstatus"><b style="color:#e6e9ef">当前：${esc(w.direction || '')}${esc(w.pattern || '')}</b>　${esc(w.position || '')}</span>`;
    } else {
      status = `<span class="wstatus"><b style="color:#e0a94a">当前无有效五浪</b>　${esc(w.why || '无可用结构')}</span>`;
    }
    const degrees = (w.degrees || []).map(d =>
      `<span class="lg"><i style="background:#c9cfdb;opacity:.65;width:${4 + d.level * 5}px"></i>${esc(d.name)}级别 ${d.count} 组</span>`
    ).join('');
    const fib = w.fib && w.fib.levels && w.fib.levels.length
      ? `<span class="lg"><i style="background:#8fa8f5;opacity:.7"></i>斐波那契：${esc(w.fib.label || '最近波段')}</span>`
      : '';
    const hint = (w.groups || []).length
      ? '<span class="lg" style="opacity:.7">颜色=浪组 · 线宽=级别</span>' : '';
    const ai = (this.ai && this.ai.chosen)
      ? `<span class="lg" style="color:#e6e9ef"><i style="background:#e6e9ef"></i>AI 主数法 #${esc(this.ai.chosen.id)}</span>`
      : '';
    el.innerHTML = status + degrees + fib + ai + hint;
  },

  onWheel(e) {
    e.preventDefault();
    if (!this.data.length) return;
    const P = { l: 8, r: 64 };
    const rect = this.cv.getBoundingClientRect();
    const iw = this.W - P.l - P.r;
    const rel = Math.max(0, Math.min(1, (e.clientX - rect.left - P.l) / iw));
    const anchor = this.start + rel * this.count;
    const factor = e.deltaY > 0 ? 1 / 1.15 : 1.15;
    const nc = Math.max(20, Math.min(this.data.length, Math.round(this.count * factor)));
    this.start = Math.round(anchor - rel * nc);
    this.count = nc;
    this.draw();
  },

  onMove(e) {
    if (!this.data.length) return;
    const P = { l: 8, r: 64 };
    const rect = this.cv.getBoundingClientRect();
    const iw = this.W - P.l - P.r;
    if (this.drag) {
      const per = iw / this.count;
      this.start = this.drag.start + Math.round((this.drag.x - e.clientX) / per);
      this.draw();
      return;
    }
    const rel = (e.clientX - rect.left - P.l) / iw;
    const idx = Math.floor(this.start + rel * this.count);
    if (idx !== this.hover) { this.hover = idx; this.draw(); }
  },

  draw() {
    if (!this.cv) return;
    const dpr = window.devicePixelRatio || 1;
    const w = this.cv.clientWidth || 900;
    this.W = w; this.H = 420;
    this.cv.width = w * dpr; this.cv.height = this.H * dpr;
    this.cv.style.height = this.H + 'px';
    const ctx = this.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, this.H);
    const PAD = { l: 8, r: 64, t: 10, b: 22 };
    ctx.font = '11px system-ui'; ctx.textBaseline = 'middle';
    if (!this.data.length) {
      ctx.fillStyle = '#6d7688'; ctx.fillText('暂无K线数据', 20, 30); return;    }
    const n = this.data.length;
    this.start = Math.max(0, Math.min(this.start, n - this.count));
    const s = Math.max(0, this.start), e = Math.min(n, s + this.count);
    const view = this.data.slice(s, e);
    const iw = w - PAD.l - PAD.r, avail = this.H - PAD.t - PAD.b;
    const ph = avail * 0.75, vh = avail * 0.22;
    const hi = Math.max(...view.map(b => b.h)), lo = Math.min(...view.map(b => b.l));
    const span = (hi - lo) || 1;
    const y = p => PAD.t + (hi - p) / span * ph;
    const bw = iw / view.length;
    const cx = i => PAD.l + i * bw + bw / 2;

    for (let g = 0; g <= 4; g++) {
      const p = lo + span * g / 4, yy = y(p);
      ctx.strokeStyle = '#1c2431'; ctx.beginPath();
      ctx.moveTo(PAD.l, yy); ctx.lineTo(PAD.l + iw, yy); ctx.stroke();
      ctx.fillStyle = '#6d7688'; ctx.fillText(p.toFixed(3), PAD.l + iw + 6, yy);
    }
    view.forEach((b, i) => {
      const col = b.c >= b.o ? '#ff5c5c' : '#35c46a';
      const x = cx(i), cw = Math.max(1, bw * 0.62);
      ctx.strokeStyle = col; ctx.beginPath();
      ctx.moveTo(x, y(b.h)); ctx.lineTo(x, y(b.l)); ctx.stroke();
      const top = y(Math.max(b.o, b.c)), bot = y(Math.min(b.o, b.c));
      ctx.fillStyle = col; ctx.fillRect(x - cw / 2, top, cw, Math.max(1, bot - top));
    });
    const vmax = Math.max(...view.map(b => b.v)) || 1, vy = this.H - PAD.b;
    view.forEach((b, i) => {
      const col = b.c >= b.o ? 'rgba(255,92,92,.45)' : 'rgba(53,196,106,.45)';
      const hh = (b.v / vmax) * vh, cw = Math.max(1, bw * 0.62);
      ctx.fillStyle = col;
      ctx.fillRect(cx(i) - cw / 2, vy - hh, cw, hh);
    });
    const drawMA = (key, color) => {
      const arr = this.mas[key]; if (!arr) return;
      ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.beginPath();
      let started = false;
      for (let i = s; i < e; i++) {
        const v = arr[i]; if (v == null) continue;
        const x = cx(i - s), yy = y(v);
        if (!started) { ctx.moveTo(x, yy); started = true; } else ctx.lineTo(x, yy);
      }
      ctx.stroke(); ctx.lineWidth = 1;
    };
    drawMA('ma5', '#e0a13c'); drawMA('ma20', '#d0679e'); drawMA('ma60', '#4fb3a0');
    if (this.period === 'day') drawMA('ma250', '#6f8fd6');
    this.drawWave(ctx, { PAD, s, e, cx, y, iw, ph });
    ctx.fillStyle = '#6d7688';
    ctx.fillText(view[0].t.slice(0, 16), PAD.l, this.H - 8);
    const lastT = view[view.length - 1].t.slice(0, 16);
    ctx.fillText(lastT, PAD.l + iw - ctx.measureText(lastT).width, this.H - 8);

    if (this.hover >= s && this.hover < e) {
      const i = this.hover - s, b = view[i], x = cx(i), yy = y(b.c);
      ctx.strokeStyle = '#5c6678'; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, this.H - PAD.b); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD.l, yy); ctx.lineTo(PAD.l + iw, yy); ctx.stroke();
      ctx.setLineDash([]);
      const txt = `${b.t}  开 ${b.o.toFixed(3)}  高 ${b.h.toFixed(3)}  低 ${b.l.toFixed(3)}  收 ${b.c.toFixed(3)}`;
      const tw = ctx.measureText(txt).width + 14;
      const bx = Math.min(Math.max(PAD.l, x - tw / 2), PAD.l + iw - tw);
      ctx.fillStyle = 'rgba(8,12,18,.92)';
      ctx.fillRect(bx, PAD.t, tw, 20);
      ctx.fillStyle = '#e6e9ef'; ctx.fillText(txt, bx + 8, PAD.t + 10);
    }
  },

  drawWave(ctx, g) {
    const w = this.wave;
    if (!w) return;
    const { PAD, s, cx, y, iw, ph } = g;
    const left = PAD.l, right = PAD.l + iw, top = PAD.t, bottom = PAD.t + ph;
    ctx.save();
    ctx.beginPath(); ctx.rect(left, top, iw, ph); ctx.clip();

    // 斐波那契回撤位：支撑/压力参考线
    const levels = (w.fib && w.fib.levels) || [];
    const fibLabels = [], fibRects = [];
    ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    levels.forEach(lv => {
      const yy = y(lv.price);
      if (yy < top || yy > bottom) return;
      const strong = Math.abs(lv.ratio - 0.382) < 1e-9 || Math.abs(lv.ratio - 0.618) < 1e-9;
      ctx.strokeStyle = strong ? 'rgba(143,168,245,.55)' : 'rgba(143,168,245,.26)';
      ctx.lineWidth = 1; ctx.setLineDash(strong ? [7, 4] : [3, 5]);
      ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(right, yy); ctx.stroke();
      fibLabels.push({ yy, strong, txt: `${lv.ratio.toFixed(3)}  ${lv.price.toFixed(3)}` });
    });
    ctx.setLineDash([]);

    const toPts = pivots => (pivots || [])
      .filter(p => Number.isInteger(p.i) && p.i >= 0 && p.i < this.data.length)
      .map(p => ({ x: cx(p.i - s), y: y(p.price), p }));
    const keyOf = pts => (pts || []).map(p => p.t || p.date || '').join('|');
    const aiKeyRaw = (this.ai && this.ai.chosen) ? keyOf(this.ai.chosen.points) : null;
    const aiKey = aiKeyRaw && (w.groups || []).some(g => keyOf(g.pivots) === aiKeyRaw)
      ? aiKeyRaw : null;

    const drawSegments = (pts, color, width, alpha, solid = false) => {
      if (pts.length < 2) return;
      ctx.globalAlpha = alpha;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        if (b.x < left || a.x > right) continue;
        ctx.strokeStyle = color; ctx.lineWidth = width;
        // 浪2、浪4 属调整组，用虚线区分
        ctx.setLineDash(!solid && (i === 1 || i === 3) ? [5, 4] : []);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    };

    // 当前结构未通过校验时，只画灰色候选，不冒充有效浪组
    drawSegments(toPts(w.candidate), '#8a93a6', 1.2, .5);

    // 所有级别浪组：一组一色，小级别先画、大级别压在上层
    const groups = (w.groups || []).map((grp, i) =>
      ({ grp, color: GROUP_COLORS[i % GROUP_COLORS.length] }));
    groups.slice()
      .sort((a, b) => (a.grp.degree || 0) - (b.grp.degree || 0))
      .forEach(({ grp, color }) => {
        const pts = toPts(grp.pivots);
        const deg = Math.max(0, Math.min(2, grp.degree || 0));
        const isAI = aiKey && keyOf(grp.pivots) === aiKey;
        const dim = aiKey && !isAI;
        const width = DEGREE_WIDTH[deg] + (isAI ? 1.1 : (grp.current ? 0.7 : 0));
        if (isAI) drawSegments(pts, 'rgba(230,233,239,.35)', width + 3, 1, true);
        drawSegments(pts, color, width, dim ? .2 : (isAI ? 1 : .88));
        ctx.globalAlpha = dim ? .25 : 1;
        pts.forEach((q, i) => {
          if (q.x < left || q.x > right) return;
          const hollow = grp.failed && i === pts.length - 1;
          ctx.beginPath(); ctx.arc(q.x, q.y, 2.2 + deg * 0.5, 0, Math.PI * 2);
          if (hollow) { ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke(); }
          else { ctx.fillStyle = color; ctx.fill(); }
        });
        ctx.globalAlpha = 1;
      });
    ctx.restore();

    // 标签统一最后画，避免被浪线穿过：位差很小时强档优先、弱档让位
    ctx.save();
    ctx.beginPath(); ctx.rect(left, top, iw, ph); ctx.clip();
    ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    const placedY = [];
    fibLabels.sort((a, b) => (b.strong - a.strong) || (a.yy - b.yy));
    fibLabels.forEach(lb => {
      if (placedY.some(v => Math.abs(v - lb.yy) < 12)) return;
      placedY.push(lb.yy);
      const tw = ctx.measureText(lb.txt).width + 8;
      ctx.fillStyle = 'rgba(11,15,22,.86)';
      ctx.fillRect(right - tw - 2, lb.yy - 7, tw, 14);
      ctx.fillStyle = lb.strong ? '#b9c8ff' : '#8fa0c8';
      ctx.fillText(lb.txt, right - 6, lb.yy);
      fibRects.push({ x0: right - tw - 2, x1: right, y0: lb.yy - 7, y1: lb.yy + 7 });
    });
    ctx.restore();

    // 编号：最近的结构优先占位；横向太挤时自动省略
    ctx.save();
    ctx.textAlign = 'center';
    const placed = [];
    const ordered = groups.slice().sort((a, b) => {
      const ea = a.grp.pivots.length ? a.grp.pivots[a.grp.pivots.length - 1].i : 0;
      const eb = b.grp.pivots.length ? b.grp.pivots[b.grp.pivots.length - 1].i : 0;
      return eb - ea;
    });
    ordered.forEach(({ grp, color }) => {
      if (aiKey && keyOf(grp.pivots) !== aiKey) return;
      const pts = toPts(grp.pivots);
      const deg = Math.max(0, Math.min(2, grp.degree || 0));
      const up = pts.length === 6 && pts[5].p.price > pts[0].p.price;
      ctx.font = `600 ${DEGREE_FONT[deg]}px system-ui`;
      pts.forEach((q, i) => {
        if (q.x < left || q.x > right) return;
        const prev = pts[i - 1], next = pts[i + 1];
        const gap = Math.min(prev ? Math.abs(q.x - prev.x) : 99,
                             next ? Math.abs(q.x - next.x) : 99);
        if (gap < 12) return;
        const isHigh = i === 0
          ? (next && next.p.price < q.p.price)
          : ((i % 2 === 1) === up);
        const x = Math.max(left + 8, Math.min(right - 8, q.x));
        const ty = Math.max(top + 7, Math.min(bottom - 3, isHigh ? q.y - 10 : q.y + 11));
        if (placed.some(p => Math.abs(p.x - x) < 11 && Math.abs(p.y - ty) < 9)) return;
        if (fibRects.some(r => x + 10 > r.x0 && x - 10 < r.x1 &&
                               ty + 5 > r.y0 && ty - 5 < r.y1)) return;
        placed.push({ x, y: ty });
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(11,15,22,.9)';
        ctx.strokeText(String(i), x, ty);
        ctx.fillStyle = color; ctx.fillText(String(i), x, ty);
      });
    });

    // AI 主数法标记
    if (aiKey) {
      const g = groups.find(x => keyOf(x.grp.pivots) === aiKey);
      const pts = g ? toPts(g.grp.pivots) : [];
      if (pts.length && pts[0].x >= left - 20 && pts[0].x <= right + 20) {
        const x = Math.max(left + 32, Math.min(right - 32, pts[0].x));
        const y = Math.max(top + 10, Math.min(bottom - 6, pts[0].y - 18));
        ctx.font = '600 10px system-ui'; ctx.textAlign = 'center';
        const text = 'AI 主数法';
        const tw = ctx.measureText(text).width + 12;
        ctx.fillStyle = 'rgba(230,233,239,.94)';
        ctx.fillRect(x - tw / 2, y - 8, tw, 16);
        ctx.fillStyle = '#0b0f16';
        ctx.fillText(text, x, y);
      }
    }
    ctx.restore();
  },
};

function renderDetailHead() {
  const d = lastDetail;
  if (!d) return;
  const a = d.analysis || {}, q = d.quote || {};
  const pct = q.change_pct, cls = pct > 0 ? 'up' : (pct < 0 ? 'down' : '');
  let badge, meta;
  if (curMode === 'small') {
    if (lastGannError) {
      badge = '<span class="badge b-hold">—</span>';
      meta = `<span class="why">小周期加载失败：${esc(lastGannError)}</span>`;
    } else {
      const g = lastGann, c = g && g.current;
      const side = c ? Number(c.side) : 0;
      const bcls = side > 0 ? 'b-add' : (side < 0 ? 'b-cut' : 'b-hold');
      badge = `<span class="badge ${bcls}">${esc(c ? (c.action || '观察') : '计算中')}</span>`;
      meta = `<span class="why">江恩7循环　${esc(c ? (c.head || '') : '小周期计算中…')}</span>`;
    }
  } else {
    badge = `<span class="badge ${badgeClass(a.action)}">${esc(a.action || '')}</span>`;
    meta = `<span class="why">评分 ${a.score ?? '—'}　建议仓位 ${a.target_position == null ? '—' : Math.round(a.target_position * 100) + '%'}</span>`;
  }
  $('#d-head').innerHTML = `
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:20px">${esc(d.name)} <span class="why">${esc(d.symbol)}</span></h2>
      <span class="num" style="font-size:18px">${q.price == null ? '—' : q.price.toFixed(3)}</span>
      <span class="num ${cls}">${pct == null ? '' : (pct > 0 ? '+' : '') + pct.toFixed(2) + '%'}</span>
      ${badge}
      ${meta}
    </div>
    <div id="d-hold" class="why" style="margin-top:8px"></div>`;
  renderDetailHolding();
}

function renderDetail(d) {
  lastDetail = d;
  renderDetailHead();
  const a = d.analysis || {};
  const wk = (a.week || {}).trend, mo = (a.month || {}).trend;
  const tfRow = (label, t, f, sl) => t
    ? `<span class="tfitem">${label} <b class="${t.up ? 'v-up' : 'v-down'}">${t.up ? '向上' : '向下'}</b>
       <span class="why">MA${f} ${t.ma_fast} / MA${sl} ${t.ma_slow}</span></span>`
    : `<span class="tfitem">${label} <span class="why">数据不足</span></span>`;
  $('#d-tf').innerHTML = `<div class="tfbar">
    ${tfRow('周线', wk, 20, 60)}${tfRow('月线', mo, 12, 24)}
    <span class="why">${esc(a.alignment || '')}</span></div>`;
  const votes = (a.votes || []).map(voteLine).join('') || stateHTML('暂无触发规则');
  const skipped = (a.skipped || []).map(s => `<div class="why">· ${esc(s.rule)}：${esc(s.why)}</div>`).join('');
  $('#d-body').innerHTML = `<div class="card">${votes}${skipped ? `<div class="skip">${skipped}</div>` : ''}</div>`;
}

document.querySelectorAll('.ptab').forEach(t => {
  t.onclick = async () => {
    if (!curSymbol) return;
    document.querySelectorAll('.ptab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    curPeriod = t.dataset.p;
    const sym = curSymbol, period = curPeriod;
    $('#chint').textContent = '加载中…';
    try {
      await KChart.load(sym, period);
      if (sym === curSymbol && period === curPeriod) chartHint();
    } catch (e) {
      if (sym !== curSymbol || period !== curPeriod) return;
      $('#chint').textContent = 'K线加载失败，请稍后重试';
      reportError('K线加载失败', e);
    }
  };
});
KChart.init();

/* AI 选浪：只在规则枚举出的候选里选出主数法，不改变评分 */
async function runAIWave() {
  if (!curSymbol) return;
  const btn = $('#ai-wave');
  if (!btn || btn.disabled) return;
  const sym = curSymbol, period = curPeriod;
  btn.disabled = true; btn.textContent = 'AI 选浪中…';
  $('#wave-ai').innerHTML = '<span class="why">模型正在复核候选结构…</span>';
  try {
    const r = await request(`/api/wave/ai/${encodeURIComponent(sym)}?period=${period}`,
                            { method: 'POST', timeout: 150000 });
    if (sym !== curSymbol || period !== curPeriod) return;
    const keyOf = pts => (pts || []).map(p => p.t || p.date || '').join('|');
    const matched = !r.chosen || ((KChart.wave && KChart.wave.groups) || [])
      .some(g => keyOf(g.pivots) === keyOf(r.chosen.points));
    KChart.ai = r;
    KChart.aiMatched = matched;
    if (KChart.wave) {
      if (r.chosen && r.chosen.fib && matched) KChart.wave.fib = { ...r.chosen.fib };
      else if (KChart.baseFib) KChart.wave.fib = KChart.baseFib;
    }
    KChart.updateWaveLegend();
    KChart.draw();
    renderWaveAI(r);
  } catch (e) {
    if (sym !== curSymbol || period !== curPeriod) return;
    $('#wave-ai').innerHTML = `<b style="color:#e0a94a">AI 选浪失败</b>　${esc(e.message || e)}`;
    reportError('AI 选浪失败', e);
  } finally {
    btn.disabled = false; btn.textContent = 'AI 选浪';
  }
}

function renderWaveAI(r) {
  const el = $('#wave-ai');
  if (!el) return;
  if (!r.chosen) {
    el.innerHTML = `<b style="color:#e6e9ef">AI：没有可采用的结构</b>　${esc(r.reason || '')}`;
    return;
  }
  const c = r.chosen;
  const byId = new Map((r.candidates || []).map(x => [x.id, x]));
  const alts = (r.alternatives || []).map(id => {
    const x = byId.get(id);
    return x ? `#${id} ${esc(x.degree)}${esc(x.direction)} ${esc(x.start)}→${esc(x.end)}` : `#${id}`;
  }).join('；');
  const conf = r.confidence == null ? '' : `　置信度 ${Math.round(r.confidence * 100)}%`;
  const model = r.model ? `　${esc(r.model)}` : '';
  const cached = r.cached ? '　缓存' : '';
  el.innerHTML =
    `<b style="color:#e6e9ef">AI 主数法：#${c.id} ${esc(c.degree)}级别${esc(c.direction)}${esc(c.pattern)}</b>` +
    `　${esc(c.start)} → ${esc(c.end)}${conf}${model}${cached}` +
    `<div class="why" style="margin-top:2px">${esc(r.reason || '')}${alts ? '　备选：' + alts : ''}</div>` +
    (KChart.aiMatched === false
      ? '<div class="why" style="color:#e0a94a">图上的浪组已变化，未找到这次选择的结构；切一次周期可刷新。</div>'
      : '') +
    `<div class="why">AI 只调整图上的主数法与斐波那契锚点，不改变规则评分。</div>`;
}

$('#ai-wave').onclick = runAIWave;

/* AI 研判：事件委托，面板重绘后按钮仍可用 */
$('#d-ai').addEventListener('click', e => {
  const more = e.target.closest('.ai-more');
  if (more) {
    const passage = more.closest('.ai-passage');
    const text = passage && passage.querySelector('.ptext');
    if (!text) return;
    const open = text.classList.toggle('open');
    more.textContent = open ? '收起' : '展开全文';
    return;
  }
  if (e.target.closest('#ai-run')) runAIAnalysis(true);
});

$('#review').onclick = async () => {
  const btn = $('#review');
  const t0 = Date.now();
  btn.disabled = true; btn.textContent = '评估中 0s';
  const tick = setInterval(() => {
    btn.textContent = `评估中 ${Math.round((Date.now() - t0) / 1000)}s`;
  }, 1000);
  try {
    const d = await request('/api/review', { method: 'POST' });
    const got = (d.items || []).filter(x => x.comment && !x.comment.startsWith('失败')
                                             && !x.comment.startsWith('接口'));
    got.forEach(x => { aiComments[x.symbol] = x.comment; });
    await loadWatch();
    $('#watch-status').textContent =
      `AI 评估完成：${got.length} 条，用时 ${Math.round((Date.now() - t0) / 1000)} 秒`;
  } catch (e) {
    $('#watch-status').textContent = watchLoaded ? '保留上次数据' : '等待刷新';
    reportError('AI 评估失败', e);
  } finally {
    clearInterval(tick);
    btn.disabled = false; btn.textContent = 'AI 重新评估';
  }
};

function backFromDetail() {
  detailVersion++;
  curSymbol = null;
  aiAnalyzing = false;
  KChart.reset();
  const origin = detailOrigin;
  switchView(origin);
  if (origin === 'positions') loadPositions();
  else loadWatch();
}
$('#back').onclick = backFromDetail;

$('#add').onclick = async () => {
  const code = $('#code').value.trim();
  if (!code) { toast('请输入证券代码'); $('#code').focus(); return; }
  $('#add').disabled = true;
  try {
    await request('/api/watchlist', { method: 'POST', body: { code, group_id: curGroup } });
    $('#code').value = '';
    await loadGroups();
    await loadWatch();
  } catch (e) { reportError('添加自选失败', e); }
  finally { $('#add').disabled = false; }
};
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#add').click(); });
$('#refresh').onclick = loadWatch;

function setAuto() {
  if (timer) { clearInterval(timer); timer = null; }
  if ($('#auto').checked) timer = setInterval(() => {
    if ($('#view-watch').classList.contains('on')) loadWatch();
  }, 15000);
}
$('#auto').onchange = setAuto;
setAuto();
if (activeTab === 'watch') loadWatch();
if (activeTab === 'positions') loadPositions();
if (activeTab === 'paper') loadPaper();

const tabViews = { '1': 'kb', '2': 'watch', '3': 'positions', '4': 'paper' };
document.addEventListener('keydown', e => {
  const editing = e.target instanceof HTMLElement &&
    (e.target.matches('input, textarea, select') || e.target.isContentEditable);
  if (e.key === 'Escape') {
    if ($('#view-detail').classList.contains('on')) { e.preventDefault(); backFromDetail(); }
    else if (!editing && $('#view-kb').classList.contains('on')) { $('#q').value = ''; $('#q').focus(); }
    return;
  }
  if (editing || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (tabViews[e.key]) {
    e.preventDefault();
    const view = tabViews[e.key];
    switchView(view);
    if (view === 'watch') loadWatch();
    else if (view === 'positions') loadPositions();
    else if (view === 'paper') loadPaper();
  } else if (e.key === '/') {
    e.preventDefault();
    switchView('kb');
    $('#q').focus();
  } else if (e.key.toLowerCase() === 'r' && $('#view-watch').classList.contains('on')) {
    e.preventDefault();
    loadWatch();
  } else if (e.key.toLowerCase() === 'r' && $('#view-positions').classList.contains('on')) {
    e.preventDefault();
    loadPositions();
  } else if (e.key.toLowerCase() === 'r' && $('#view-paper').classList.contains('on')) {
    e.preventDefault();
    loadPaper();
  }
});
</script>
